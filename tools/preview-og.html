<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../preview/assets/css/site.css">
<style>
  html, body { margin: 0; overflow: hidden; }
  .og {
    position: relative; overflow: hidden; isolation: isolate;
    width: 1200px; height: 630px; padding: 64px 72px;
    display: flex; flex-direction: column; justify-content: space-between;
    background: var(--bg);
  }
  .og::before {
    content: ""; position: absolute; inset: 0; z-index: -1;
    background:
      radial-gradient(ellipse 50% 60% at 82% 10%, rgba(189, 247, 95, .28), transparent 70%),
      radial-gradient(ellipse 40% 50% at 0% 100%, rgba(76, 132, 255, .22), transparent 70%);
  }
  .og-top { display: flex; align-items: center; gap: 14px; font-size: 26px; font-weight: 600; letter-spacing: -.02em; }
  .og-top svg { width: 40px; height: 40px; fill: var(--lime); }
  .og h1 {
    font-size: 104px; font-weight: 600; line-height: .98; letter-spacing: -.05em;
    background: linear-gradient(180deg, #fff 35%, #a9afba); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .og-apps { display: flex; gap: 16px; }
  .og-apps img { width: 72px; height: 72px; border-radius: 18px; box-shadow: 0 0 0 1px rgba(255, 255, 255, .1); }
  .icon { display: none; width: 180px; height: 180px; background: #101214; }
  .icon img { width: 180px; height: 180px; }
  :target.icon { display: block; }
  body:has(:target.icon) .og { display: none; }
</style>
</head>
