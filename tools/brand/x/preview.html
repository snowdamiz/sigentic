<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sigentic Labs — X profile preview</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=block">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #151719; color: #f4f5f7; font-family: Geist, sans-serif; }
    main { width: 980px; padding: 40px; }
    .card { position: relative; overflow: hidden; background: #060708; border: 1px solid #292d31; border-radius: 16px; }
    .banner { display: block; width: 898px; height: auto; }
    .avatar { position: absolute; top: 230px; left: 26px; width: 140px; height: 140px; border: 6px solid #060708; border-radius: 50%; }
    .details { padding: 88px 32px 30px; }
    h1 { font-size: 27px; letter-spacing: -.04em; margin: 0 0 8px; }
    p { font-size: 15px; color: #a5aab3; margin: 0; }
    .caption { padding: 20px 0 0; display: flex; justify-content: space-between; font-size: 12px; color: #a5aab3; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <img class="banner" src="sigentic-x-banner.png" alt="Sigentic Labs banner">
      <img class="avatar" src="sigentic-x-profile.png" alt="Seed profile picture, circular crop">
      <div class="details"><h1>Sigentic Labs</h1><p>Independent software lab. We invent apps for everyday life.</p></div>
    </div>
    <div class="caption"><span>PROFILE PREVIEW</span><span>Avatar 400 × 400 · Banner 1500 × 500</span></div>
  </main>
</body>
</html>
