<!doctype html>
<!-- Social share image template (1200×630). Run: see README → "Regenerating brand images". -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..600&family=Geist+Mono:wght@400&family=Instrument+Serif:ital@1&display=block">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #060708; }
  body { position: relative; font-family: 'Geist', sans-serif; color: #f4f5f7; -webkit-font-smoothing: antialiased; }
  canvas { position: absolute; inset: 0; }

  /* the particles' light, as in the hero */
  .light { position: absolute; left: 905px; top: 292px; width: 640px; height: 640px; transform: translate(-50%, -50%); border-radius: 50%;
    background: radial-gradient(closest-side, rgba(200, 249, 122, 0.11), rgba(200, 249, 122, 0.03) 55%, transparent); }
  /* registration marks around the mark, as in the hero */
  .marks { position: absolute; left: 732px; top: 119px; width: 346px; height: 346px; --c: rgba(255, 255, 255, 0.16); --l: 14px;
    background:
      linear-gradient(var(--c),var(--c)) top left/var(--l) 1px, linear-gradient(var(--c),var(--c)) top left/1px var(--l),
      linear-gradient(var(--c),var(--c)) top right/var(--l) 1px, linear-gradient(var(--c),var(--c)) top right/1px var(--l),
      linear-gradient(var(--c),var(--c)) bottom left/var(--l) 1px, linear-gradient(var(--c),var(--c)) bottom left/1px var(--l),
      linear-gradient(var(--c),var(--c)) bottom right/var(--l) 1px, linear-gradient(var(--c),var(--c)) bottom right/1px var(--l);
    background-repeat: no-repeat; }

  .top { position: absolute; left: 72px; right: 72px; top: 64px; display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 25px; font-weight: 600; letter-spacing: -0.03em; }
  .brand img { width: 34px; height: 34px; }
  .brand b { font-weight: 600; }
  .brand span { color: #a5aab3; font-weight: 500; }
  .domain { font-family: 'Geist Mono', monospace; font-size: 16px; letter-spacing: 0.02em; color: #7b818a; }

  h1 { position: absolute; left: 72px; top: 196px; margin: 0; font-size: 88px; font-weight: 500; letter-spacing: -0.055em; line-height: 0.98; }
  h1 em { font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; font-size: 1.1em; letter-spacing: -0.02em; color: #c8f97a; }

  .products { position: absolute; left: 72px; right: 72px; bottom: 64px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
  .products div { display: grid; grid-template-columns: auto 1fr; column-gap: 14px; align-items: center; }
  .products img { grid-row: span 2; width: 42px; height: 42px; border-radius: 11px; outline: 1px solid rgba(255, 255, 255, 0.12); outline-offset: -1px; }
  .products b { font-size: 20px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.15; }
  .products span { font-size: 15px; color: #7b818a; line-height: 1.3; }
</style>
</head>
<body>
  <div class="light"></div>
  <canvas id="c" width="1200" height="630"></canvas>
  <div class="marks"></div>

  <div class="top">
    <div class="brand"><img src="../assets/img/logo.svg" alt=""><b>Sigentic <span>Labs</span></b></div>
    <div class="domain">sigenticlabs.com</div>
  </div>

  <h1>We invent apps<br>for <em>everyday life.</em></h1>

  <div class="products">
    <div><img src="../assets/img/work/savorly-icon.svg" alt=""><b>Savorly</b><span>Cooking</span></div>
    <div><img src="../assets/img/work/morse-icon.svg" alt=""><b>Morse</b><span>Private messaging</span></div>
    <div><img src="../assets/img/work/mesh-icon.svg" alt=""><b>Mesh</b><span>Programming language</span></div>
    <div><img src="../assets/img/work/incant-icon.svg" alt=""><b>Incant</b><span>Game engine</span></div>
  </div>

<script type="module">
  // A still of the hero's particle mark. Seeded, so every render is the same image.
  let seed = 7;
  const rand = () => { seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

  const ctx = document.getElementById('c').getContext('2d');
  const S = 220;
  const off = document.createElement('canvas'); off.width = off.height = S;
  const g = off.getContext('2d');
  const logo = new Image();
  logo.src = '../assets/img/logo.svg';
  await logo.decode();
  g.drawImage(logo, 0, 0, S, S);
  const d = g.getImageData(0, 0, S, S).data, pool = [];
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) if (d[(y * S + x) * 4 + 3] > 140) pool.push([x, y]);

  const cx = 905, cy = 292, size = 300, N = 2300;
  const a = [221, 255, 177], b = [189, 247, 95];
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < N; i++) {
    const p = pool[(rand() * pool.length) | 0];
    const nx = (p[0] + rand()) / S - 0.5, ny = (p[1] + rand()) / S - 0.5;
    const t = Math.min(1, Math.max(0, (nx + ny) * 0.75 + 0.5));
    const c = a.map((v, j) => Math.round(v + (b[j] - v) * t));
    const z = 1.1 + rand() * 1.3;
    ctx.fillStyle = `rgba(${c},0.85)`;
    ctx.fillRect(cx + nx * size - z / 2, cy + ny * size - z / 2, z, z);
    if (i % 5 === 0) { ctx.fillStyle = `rgba(${c},0.05)`; ctx.fillRect(cx + nx * size - z * 2, cy + ny * size - z * 2, z * 4, z * 4); }
  }
  // ambient dust, kept off the text
  ctx.fillStyle = 'rgba(255,255,255,0.16)';
  for (let i = 0; i < 70; i++) {
    const x = 620 + rand() * 580, y = rand() * 470;
    ctx.fillRect(x, y, 1.2, 1.2);
  }
  document.documentElement.dataset.rendered = 'true';
</script>
</body>
</html>
