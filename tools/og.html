<!doctype html>
<!-- Social share image template (1200×630). Run: see README → "Regenerating brand images". -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..700&display=block">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #FFFFFF; }
  body { position: relative; font-family: 'Schibsted Grotesk', sans-serif; color: #16171A; -webkit-font-smoothing: antialiased; }
  canvas { position: absolute; inset: 0; }

  .top { position: absolute; left: 72px; right: 72px; top: 60px; display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 26px; font-weight: 600; letter-spacing: -0.01em; }
  .brand i { width: 34px; height: 34px; background: #16171A; -webkit-mask: url(../assets/img/logo.svg) center / contain no-repeat; mask: url(../assets/img/logo.svg) center / contain no-repeat; }
  .domain { font-size: 20px; font-weight: 500; color: #5B5E65; }

  h1 { position: absolute; left: 72px; top: 196px; margin: 0; font-size: 80px; font-weight: 600; line-height: 1.02; letter-spacing: -0.045em; }

  .products { position: absolute; left: 72px; right: 72px; bottom: 60px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; padding-top: 28px; border-top: 1px solid rgba(22, 23, 26, 0.10); }
  .products div { display: grid; grid-template-columns: auto 1fr; column-gap: 13px; align-items: center; }
  .products img { grid-row: span 2; width: 44px; height: 44px; border-radius: 11px; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.06), 0 4px 10px -4px rgba(0, 0, 0, 0.2); }
  .products b { font-size: 21px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; }
  .products span { font-size: 15px; color: #5B5E65; line-height: 1.3; white-space: nowrap; }
</style>
</head>
<body>
  <canvas id="c" width="1200" height="630"></canvas>

  <div class="top">
    <div class="brand"><i></i>Sigentic Labs</div>
    <div class="domain">sigenticlabs.com</div>
  </div>

  <h1>We invent apps<br>for everyday life.</h1>

  <div class="products">
    <div><img src="../assets/img/work/savorly-icon.svg" alt=""><b>Savorly</b><span>Cooking</span></div>
    <div><img src="../assets/img/work/morse-icon.svg" alt=""><b>Morse</b><span>Private messaging</span></div>
    <div><img src="../assets/img/work/mesh-icon.svg" alt=""><b>Mesh</b><span>Programming language</span></div>
    <div><img src="../assets/img/work/incant-icon.svg" alt=""><b>Incant</b><span>Game engine</span></div>
    <div><img src="../assets/img/work/mixer-icon.png" alt=""><b>Mixer</b><span>Mobile platform</span></div>
  </div>

<script type="module">
  // A still of the hero's first scene: the Seed in ink dots over a lime wash. Seeded, so every render is the same image.
  let seed = 7;
  const rand = () => { seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

  const ctx = document.getElementById('c').getContext('2d');
  const S = 240;
  const off = document.createElement('canvas'); off.width = off.height = S;
  const g = off.getContext('2d');
  const logo = new Image();
  logo.src = '../assets/img/logo.svg';
  await logo.decode();
  g.drawImage(logo, 0, 0, S, S);
  const d = g.getImageData(0, 0, S, S).data, pool = [];
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) if (d[(y * S + x) * 4 + 3] > 140) pool.push([x, y]);

  const cx = 952, cy = 300, size = 330, N = 2600;
  const dots = Array.from({ length: N }, () => {
    const p = pool[(rand() * pool.length) | 0];
    const nx = (p[0] + rand()) / S - 0.5, ny = (p[1] + rand()) / S - 0.5;
    const shade = Math.min(0.999, Math.max(0, (nx + ny) * 0.8 + 0.5 + (rand() - 0.5) * 0.25));
    return { x: cx + nx * size, y: cy + ny * size, r: 0.5 + rand() * 0.45, shade };
  });

  ctx.fillStyle = '#BDF75F';
  ctx.beginPath();
  dots.forEach(({ x, y }) => { ctx.moveTo(x + 5 + 2.9, y + 5); ctx.arc(x + 5, y + 5, 2.9, 0, Math.PI * 2); });
  ctx.fill();

  ctx.fillStyle = '#16171A';
  ctx.beginPath();
  dots.forEach(({ x, y, r, shade }) => { const s = r * (0.9 + shade * 1.1); ctx.moveTo(x + s, y); ctx.arc(x, y, s, 0, Math.PI * 2); });
  ctx.fill();
  document.documentElement.dataset.rendered = 'true';
</script>
</body>
</html>
