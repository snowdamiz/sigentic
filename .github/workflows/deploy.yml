name: Deploy

# A push to the `release` branch deploys the site to sigenticlabs.com:
#
#   git push origin main:release
#
# It can also be run by hand from the Actions tab.
on:
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits for the running one instead of cancelling it.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # Same version as local development, so a deploy here matches `wrangler deploy` there.
  WRANGLER_VERSION: 4.151.0
  # sigenticlabs.com
  ZONE_ID: 0589c4d27dc4177205edccd438a6dbcc

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://sigenticlabs.com
    steps:
      - name: Check Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          missing=()
          [[ -z "$CLOUDFLARE_API_TOKEN" ]] && missing+=("secret CLOUDFLARE_API_TOKEN")
          [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]] && missing+=("variable CLOUDFLARE_ACCOUNT_ID")
          if (( ${#missing[@]} )); then
            echo "::error title=Missing Cloudflare credentials::This repo is missing: ${missing[*]}. See 'Deploy' in README.md."
            exit 1
          fi
          # The custom domains in wrangler.jsonc need zone-level Workers Routes access on top
          # of the account-level Workers access. Without it the script uploads and then the
          # deploy fails on the domains, which reads like a broken deploy.
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes")
          if [[ "$code" != "200" ]]; then
            echo "::error title=Token cannot manage Workers routes::CLOUDFLARE_API_TOKEN cannot read the Workers routes of sigenticlabs.com (HTTP $code). Give the token 'Zone > Workers Routes > Edit' and 'Zone > Zone > Read' for sigenticlabs.com."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Deploy
        run: npx --yes "wrangler@${WRANGLER_VERSION}" deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Check the live site
        shell: bash
        run: |
          set -euo pipefail
          check() { # url, expected status
            local code=""
            for _ in $(seq 1 12); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$1") || true
              [[ "$code" == "$2" ]] && { echo "$1 -> $code"; return 0; }
              sleep 5
            done
            echo "::error title=Live check failed::$1 returned $code, expected $2."
            return 1
          }
          check https://sigenticlabs.com/ 200
          check https://sigenticlabs.com/privacy.html 200
          check https://www.sigenticlabs.com/ 301
